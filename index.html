<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WealthPilot">
<title>WealthPilot</title>
<script>
(function(){
  const t=localStorage.getItem('wp_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  const iconHref=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='36' fill='%231a56db'/%3E%3Cpolyline points='28,130 72,76 100,106 164,42' fill='none' stroke='white' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E`;
  const mf=JSON.stringify({name:'WealthPilot',short_name:'WealthPilot',start_url:'./',display:'standalone',background_color:'#ffffff',theme_color:'#1a56db',orientation:'portrait',icons:[{src:iconHref,sizes:'192x192',type:'image/svg+xml'}]});
  const ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/json,'+encodeURIComponent(mf);document.head.appendChild(ml);
  if('serviceWorker' in navigator){
    const sw=`const C='wp-v4';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([location.pathname]))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const rc=res.clone();caches.open(C).then(c=>c.put(e.request,rc));return res;}))));`;
    const b=new Blob([sw],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(b),{scope:'/'}).catch(()=>{});
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root{
  --blue:#1a56db;--blue-l:#eff4ff;
  --green:#0e9f6e;--green-l:#f0fdf4;--green-bg:rgba(14,159,110,.1);
  --red:#e02424;--red-l:#fef2f2;--red-bg:rgba(224,36,36,.1);
  --amber:#d97706;--amber-l:#fffbeb;--amber-bg:rgba(217,119,6,.1);
  --purple:#7c3aed;
  --font:'Plus Jakarta Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --r:10px;--r-lg:14px;--r-xl:18px;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --nav-h:60px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ── LIGHT ── */
[data-theme="light"]{
  --bg:#f7f8fa;--bg2:#ffffff;--bg3:#f0f1f5;
  --border:#e2e4ea;--border2:#d0d3dc;
  --t1:#0f1117;--t2:#374151;--t3:#6b7280;--t4:#9ca3af;
  --hdr-bg:rgba(247,248,250,.94);
  --nav-bg:#ffffff;
  --modal-bg:#ffffff;--scrim:rgba(0,0,0,.4);
}
/* ── DARK ── */
[data-theme="dark"]{
  --bg:#111111;--bg2:#1c1c1c;--bg3:#262626;
  --border:#2e2e2e;--border2:#3a3a3a;
  --t1:#f0f0f0;--t2:#c0c0c0;--t3:#888;--t4:#555;
  --hdr-bg:rgba(17,17,17,.94);
  --nav-bg:#1c1c1c;
  --modal-bg:#1c1c1c;--scrim:rgba(0,0,0,.7);
  --blue:#5b9cf6;--blue-l:#1a2d4a;
  --green:#34d399;--green-l:#0d2e20;--green-bg:rgba(52,211,153,.1);
  --red:#f87171;--red-l:#2e0e0e;--red-bg:rgba(248,113,113,.1);
  --amber:#fbbf24;--amber-l:#2e1e06;--amber-bg:rgba(251,191,36,.1);
}
/* ── SOFT DARK ── */
[data-theme="soft-dark"]{
  --bg:#1a1a1f;--bg2:#222228;--bg3:#2a2a32;
  --border:#3d3d4a;--border2:#333340;
  --t1:#ececf1;--t2:#b8b8c8;--t3:#888898;--t4:#555565;
  --hdr-bg:rgba(26,26,31,.96);--nav-bg:rgba(26,26,31,.97);
  --modal-bg:#222228;--scrim:rgba(0,0,0,.6);
  --blue:#5b9cf6;--blue-l:#1e2d50;
  --green:#34d399;--green-l:#0d2e20;--green-bg:rgba(52,211,153,.1);
  --red:#f87171;--red-l:#2e1010;--red-bg:rgba(248,113,113,.1);
  --amber:#fbbf24;--amber-l:#2a1f06;--amber-bg:rgba(251,191,36,.1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 20px);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;position:fixed;width:100%;touch-action:none}
::-webkit-scrollbar{width:0;height:0}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:80;background:var(--hdr-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:calc(var(--safe-t) + 11px) 16px 11px;display:flex;align-items:center;justify-content:space-between}
.hdr-brand{display:flex;align-items:center;gap:9px}
.hdr-logo{width:32px;height:32px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hdr-name{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.3px}
.hdr-sub{font-size:10px;color:var(--t3);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.hdr-date{font-size:11px;color:var(--t4);font-family:var(--mono);margin-right:2px}
.btn-pill{background:var(--blue);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-family:var(--font)}
.btn-pill:active{opacity:.85}
.btn-icon{width:32px;height:32px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--t3)}
.btn-icon:active{opacity:.7}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--nav-bg);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b)}
.nvi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;cursor:pointer;border:none;background:none;font-family:var(--font)}
.nvi-icon{font-size:17px;color:var(--t4);line-height:1}
.nvi-label{font-size:10px;font-weight:500;color:var(--t4)}
.nvi.act .nvi-icon,.nvi.act .nvi-label{color:var(--blue)}
.nvi.act{position:relative}
.nvi.act::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--blue);border-radius:0 0 2px 2px}

/* ── PAGES ── */
.pg{display:none;animation:pgIn .2s var(--ease) both}
.pg.act{display:block}
@keyframes pgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.container{padding:12px 16px 0}
.pg-spacer{height:24px}

/* ── HERO CARD ── */
.hero{margin:14px 16px 0;background:var(--blue);border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.07);border-radius:50%;pointer-events:none}
.hero-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.65);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.hero-amt{font-size:32px;font-weight:700;color:#fff;letter-spacing:-.8px;font-family:var(--mono)}
.hero-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px;line-height:1.5}
.hero-chips{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}

/* ── SECTION ── */
.sec{padding:16px 16px 0}
.sec-hd{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}

/* ── COLLAPSIBLE SECTION ── */
.csec{padding:14px 16px 0}
.csec-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.csec-hd-l{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase}
.csec-hd-r{display:flex;align-items:center;gap:8px}
.csec-tot{font-size:11px;font-weight:600;color:var(--t2);font-family:var(--mono)}
.csec-chev{font-size:13px;color:var(--t4);transition:transform .22s var(--ease)}
.csec-hd.open .csec-chev{transform:rotate(180deg)}
.csec-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .28s var(--ease),opacity .22s}
.csec-body.open{max-height:3000px;opacity:1}
.csec-body-inner{padding-top:10px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-lbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:18px;font-weight:700;color:var(--t1);font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--t4);margin-top:3px}

/* ── WEALTH CARD ── */
.wealth-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.wealth-val{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--t1);letter-spacing:-.5px;margin:5px 0}
.wealth-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;border-top:1px solid var(--border)}
.wealth-cell{padding:12px 0 0}
.wealth-cell:nth-child(1){border-right:1px solid var(--border);padding-right:16px}
.wealth-cell:nth-child(2){padding-left:16px}
.wealth-cell-lbl{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.wealth-cell-val{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--t1)}

/* ── ALLOC BAR ── */
.alloc-bar{height:8px;border-radius:8px;display:flex;overflow:hidden;gap:2px;margin-bottom:10px}
.alloc-legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.alloc-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.alloc-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── ASSET / ROW CARD ── */
.acard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:border-color .15s,background .1s}
.acard:active{border-color:var(--blue);background:var(--bg3)}
.acard-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.acard-body{flex:1;min-width:0}
.acard-name{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-meta{font-size:11px;color:var(--t4);margin-top:2px}
.acard-right{text-align:right;flex-shrink:0}
.acard-val{font-size:14px;font-weight:700;color:var(--t1);font-family:var(--mono)}
.acard-pnl{font-size:11px;margin-top:2px;font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--t4)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-left:5px;vertical-align:middle;letter-spacing:.01em}
.bd-blue{background:var(--blue-l);color:var(--blue)}
.bd-green{background:var(--green-l);color:var(--green)}
.bd-amber{background:var(--amber-l);color:var(--amber)}
.bd-purple{background:rgba(124,58,237,.1);color:var(--purple)}
.bd-red{background:var(--red-l);color:var(--red)}
.bd-gray{background:var(--bg3);color:var(--t3)}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.pill-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(14,159,110,.2)}
.pill-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(224,36,36,.2)}
.pill-amber{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(217,119,6,.2)}
.pill-blue{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.pill-muted{background:var(--bg3);color:var(--t3);border:1px solid var(--border)}

/* ── GOAL CARD ── */
.goal-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.goal-card-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .1s}
.goal-card-hdr:active{background:var(--bg3)}
.goal-card-icon{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.goal-card-name{font-size:13px;font-weight:700;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-card-meta{display:flex;align-items:center;gap:7px;flex-shrink:0}
.goal-card-pct{font-size:12px;font-weight:700;color:var(--blue);font-family:var(--mono)}
.goal-card-chev{color:var(--t4);transition:transform .22s var(--ease);display:flex;align-items:center;font-size:12px}
.goal-card.open .goal-card-chev{transform:rotate(180deg)}
.goal-card-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .28s var(--ease),opacity .2s}
.goal-card.open .goal-card-body{max-height:500px;opacity:1}
.goal-card-progress{padding:10px 14px 4px}
.goal-card-bar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.goal-card-saved{font-size:13px;font-weight:700;color:var(--t1);font-family:var(--mono)}
.goal-card-target{font-size:11px;color:var(--t3)}
.goal-card-actions{padding:8px 14px 12px;border-top:1px solid var(--border);display:flex;gap:8px;margin-top:8px}

/* ── PROGRESS ── */
.prog-track{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .5s var(--ease)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font);font-weight:600;border:none;cursor:pointer;transition:transform .15s var(--spring),opacity .12s;user-select:none}
.btn:active{transform:scale(.94);opacity:.88}
.btn-primary{background:var(--blue);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px}
.btn-ghost{background:var(--bg3);color:var(--t2);padding:10px 14px;border-radius:var(--r);font-size:13px;border:1px solid var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:10px 14px;border-radius:var(--r);font-size:13px;border:1px solid rgba(224,36,36,.2)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.add-btn{width:100%;padding:11px;background:transparent;border:1.5px dashed var(--border2);border-radius:var(--r);font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;font-family:var(--font);transition:background .15s;margin-bottom:8px}
.add-btn:active{background:var(--bg3)}

/* ── PROJ ── */
.proj-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.proj-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.proj-yr{font-size:11px;color:var(--t4);font-weight:500;margin-bottom:4px}
.proj-amt{font-size:12px;font-weight:700;color:var(--blue);font-family:var(--mono)}

/* ── INFO ROWS ── */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-key{font-size:12px;color:var(--t3)}
.info-val{font-size:12px;font-weight:600;color:var(--t1);font-family:var(--mono)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:8px}

/* ── KIDS PHASE ── */
.phase-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-top:1px solid var(--border);transition:background .1s}
.phase-row:active{background:var(--bg3)}
.phase-ico{width:32px;height:32px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.phase-info{flex:1;min-width:0}
.phase-name{font-size:12px;font-weight:600;color:var(--t1)}
.phase-age{font-size:11px;color:var(--t3);margin-top:2px}
.phase-prog{width:80px;flex-shrink:0}
.phase-pct{font-size:12px;font-weight:700;color:var(--blue);font-family:var(--mono);text-align:right;margin-bottom:3px}

/* ── BUCKET CARDS ── */
.bkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bkt{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bkt-lbl{font-size:10px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.bkt-val{font-size:14px;font-weight:700;color:var(--t1);font-family:var(--mono)}
.bkt-tgt{font-size:10px;color:var(--t4);margin-top:2px}
.bkt-bar{height:4px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden}
.bkt-fill{height:100%;border-radius:4px}
.bkt-detail{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bkt-drow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.bkt-dname{font-size:13px;font-weight:600;color:var(--t1)}
.bkt-dnote{font-size:11px;color:var(--t4);margin-top:2px}
.bkt-pct{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:var(--mono)}
.bkt-prog{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bkt-prog-fill{height:100%;border-radius:6px}
.bkt-nums{display:flex;justify-content:space-between;font-size:11px;color:var(--t4);font-family:var(--mono)}
.bkt-alert{font-size:12px;color:var(--t2);padding:8px 10px;background:var(--bg3);border-radius:var(--r);margin-bottom:6px;border-left:3px solid var(--blue);line-height:1.5}

/* ── SIP ── */
.sip-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:border-color .15s}
.sip-item:active{border-color:var(--blue)}
.sip-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sip-name{font-size:13px;font-weight:600;color:var(--t1)}
.sip-amt{font-size:14px;font-weight:700;color:var(--blue);font-family:var(--mono)}
.sip-bar-track{height:5px;background:var(--bg3);border-radius:5px;overflow:hidden}
.sip-bar-fill{height:100%;border-radius:5px}

/* ── CHECKLIST ── */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;cursor:pointer;background:transparent;border-bottom:1px solid var(--border);transition:background .1s}
.check-item:last-child{border-bottom:none}
.check-item:active{background:var(--bg3)}
.check-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s var(--spring)}
.check-item.done .check-box{background:var(--blue);border-color:var(--blue);color:#fff}
.check-label{font-size:13px;font-weight:600;color:var(--t1)}
.check-desc{font-size:11px;color:var(--t3);margin-top:2px}

/* ── INSURANCE ── */
.ins-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:background .1s}
.ins-row:active{background:var(--bg3)}

/* ── MORE PAGE ── */
.more-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px;cursor:pointer;transition:background .1s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.more-row:active{background:var(--bg3)}
.more-icon{width:38px;height:38px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.more-row-body{flex:1}
.more-row-title{font-size:13px;font-weight:600;color:var(--t1)}
.more-row-sub{font-size:11px;color:var(--t3);margin-top:2px}

/* ── SAFETY / ALERT BANNERS ── */
.alert-banner{border-radius:var(--r-lg);overflow:hidden;margin-bottom:10px}
.alert-banner-hdr{display:flex;align-items:center;gap:9px;padding:10px 13px 9px;border-bottom:1px solid transparent}
.alert-gap-row{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;transition:background .1s}

/* ── SETTINGS ── */
.settings-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow-label{font-size:13px;font-weight:500;color:var(--t1)}
.srow-sub{font-size:11px;color:var(--t4);margin-top:2px}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:13px;transition:background .2s;cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--blue)}
.toggle-track::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-track::after{transform:translateX(18px)}
.theme-pills{display:flex;gap:6px;flex-shrink:0}
.theme-pill{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:var(--bg3);color:var(--t3);cursor:pointer;font-family:var(--font);transition:all .15s}
.theme-pill.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.size-pills{display:flex;gap:5px;flex-shrink:0}
.size-pill{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:var(--bg3);color:var(--t3);cursor:pointer;font-family:var(--font);transition:all .15s}
.size-pill.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.backup-btns{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.btn-backup{width:100%;padding:13px;border-radius:var(--r);font-size:13px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font)}
.btn-export{background:var(--blue);color:#fff}
.btn-import{background:var(--bg3);color:var(--t2);border:1px solid var(--border2)}
.btn-reset{background:var(--red-bg);color:var(--red);border:1px solid rgba(224,36,36,.2)}
.btn-backup:active{opacity:.85}

/* ── SHEET / MODAL ── */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--scrim);backdrop-filter:blur(3px)}
.overlay.open{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--modal-bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s var(--ease);padding:20px 16px calc(20px + var(--safe-b));border-top:1px solid var(--border)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:3px}
.sheet-sub{font-size:12px;color:var(--t4);margin-bottom:18px}
.field{margin-bottom:14px}
.field-lbl{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px;letter-spacing:.02em}
.field-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-family:var(--mono);font-size:14px;padding:11px 12px;outline:none;transition:border-color .15s}
.field-inp:focus{border-color:var(--blue)}
select.field-inp{font-family:var(--font)}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn-save{flex:1;background:var(--blue);color:#fff;font-size:14px;font-weight:600;padding:13px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font)}
.btn-cancel{flex:1;background:var(--bg3);color:var(--t2);font-size:14px;font-weight:500;padding:13px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-family:var(--font)}
.btn-save:active,.btn-cancel:active{opacity:.85}
.btn-del-full{width:100%;margin-top:8px;padding:11px;background:var(--red-bg);color:var(--red);border:1px solid rgba(224,36,36,.25);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}

/* ── CONFIRM ── */
.confirm-box{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;background:var(--scrim)}
.confirm-box.open{display:flex}
.confirm-card{background:var(--modal-bg);border-radius:var(--r-xl);padding:24px 20px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.confirm-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px}
.confirm-sub{font-size:13px;color:var(--t3);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-ok{flex:1;padding:11px;border-radius:8px;font-size:13px;font-weight:600;background:var(--red-bg);color:var(--red);border:1px solid rgba(224,36,36,.25);cursor:pointer;font-family:var(--font)}
.confirm-cancel{flex:1;padding:11px;border-radius:8px;font-size:13px;font-weight:500;background:var(--bg3);color:var(--t2);border:1px solid var(--border);cursor:pointer;font-family:var(--font)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(70px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(12px);background:var(--t1);color:var(--bg);font-size:13px;font-weight:500;padding:10px 20px;border-radius:20px;z-index:400;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;font-family:var(--font)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:32px 16px;color:var(--t4)}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.4}
.empty-text{font-size:13px;color:var(--t3)}

/* ── LAST UPDATED ── */
.last-upd{text-align:center;font-size:11px;color:var(--t4);padding:16px;font-family:var(--mono)}

/* ── BACKUP MODAL ── */
.backup-modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;background:var(--scrim)}
.backup-modal.show{display:flex}
.backup-card{background:var(--modal-bg);border-radius:22px 22px 0 0;padding:24px 16px calc(24px + var(--safe-b));width:100%;border-top:1px solid var(--border)}

#file-input{display:none}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo"><svg viewBox="0 0 24 24"><polyline points="2 17 9 10 13 14 22 5"/><polyline points="16 5 22 5 22 11"/></svg></div>
    <div>
      <div class="hdr-name" id="hdr-name">WealthPilot</div>
      <div class="hdr-sub" id="hdr-greeting"></div>
    </div>
  </div>
  <div class="hdr-right">
    <span class="hdr-date" id="hdrDate"></span>
    <button class="btn-pill" onclick="openSheet('global')">Edit</button>
  </div>
</header>

<!-- PAGES -->
<div id="pg-home"        class="pg act"></div>
<div id="pg-goals"       class="pg"></div>
<div id="pg-invest"      class="pg"></div>
<div id="pg-sip"         class="pg"></div>
<div id="pg-settings"    class="pg"></div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nvi act" onclick="nav(this,'home')"><span class="nvi-icon">⌂</span><span class="nvi-label">Home</span></button>
  <button class="nvi" onclick="nav(this,'goals')"><span class="nvi-icon">◎</span><span class="nvi-label">Goals</span></button>
  <button class="nvi" onclick="nav(this,'invest')"><span class="nvi-icon">◈</span><span class="nvi-label">Assets</span></button>
  <button class="nvi" onclick="nav(this,'sip')"><span class="nvi-icon">↻</span><span class="nvi-label">SIP</span></button>
  <button class="nvi" onclick="nav(this,'settings')"><span class="nvi-icon">⚙</span><span class="nvi-label">Settings</span></button>
</nav>

<!-- SHEET OVERLAY -->
<div class="overlay" id="sheet-overlay" onclick="if(event.target===this)closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-content"></div>
</div>

<!-- CONFIRM -->
<div class="confirm-box" id="confirm-box">
  <div class="confirm-card">
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-sub"   id="confirm-sub"></div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-ok"     id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BACKUP MODAL -->
<div class="backup-modal" id="backup-modal">
  <div class="backup-card">
    <div style="font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px">📦 Back up your data</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:18px">Export a JSON backup so you never lose your data. Recommended after every few updates.</div>
    <div style="display:flex;gap:10px">
      <button class="btn-backup btn-export" style="flex:1" onclick="exportJSON()">⬇ Export now</button>
      <button class="btn-backup btn-import" style="flex:1" onclick="dismissBackupModal()">Later</button>
    </div>
  </div>
</div>
<input type="file" id="file-input" accept=".json" onchange="importJSON(event)">

<script>
// ══════════════════════════════════════════════════════
// DATA MODEL
// ══════════════════════════════════════════════════════
const STORAGE_KEY='wp4_data';
const DEF_DATA={
  profile:{name:'',monthlyIncome:207165,monthlyExpenses:68000,avatarColor:'#1a56db'},
  assets:[
    {id:'a1',category:'EPF',        name:'EPF',                    currentValue:1658200,invested:1658200,sip:0,      bucket:'retire'},
    {id:'a2',category:'PPF',        name:'PPF',                    currentValue:342000, invested:342000, sip:0,      bucket:'retire'},
    {id:'a3',category:'NPS',        name:'NPS',                    currentValue:117052, invested:117052, sip:0,      bucket:'retire'},
    {id:'a4',category:'MutualFunds',name:'Parag Parikh Flexi Cap', currentValue:152801, invested:150982, sip:50000,  bucket:'return'},
    {id:'a5',category:'MutualFunds',name:'HDFC Mid Cap Fund',      currentValue:155856, invested:150172, sip:40000,  bucket:'return'},
    {id:'a6',category:'MutualFunds',name:'Bandhan Small Cap',      currentValue:162013, invested:144988, sip:30000,  bucket:'return'},
    {id:'a7',category:'MutualFunds',name:'Axis ELSS Tax Saver',    currentValue:27543,  invested:23001,  sip:0,      bucket:'return'},
    {id:'a8',category:'MutualFunds',name:'Quant ELSS Tax Saver',   currentValue:11900,  invested:10001,  sip:0,      bucket:'return'},
    {id:'a9',category:'ETF',        name:'GOLDBEES',               currentValue:135720, invested:122576, sip:0,      bucket:'stability'},
    {id:'a10',category:'ETF',       name:'MON100 (Nasdaq 100)',    currentValue:29227,  invested:19911,  sip:0,      bucket:'return'},
    {id:'a11',category:'MutualFunds',name:'HDFC Balanced Advantage',currentValue:139182,invested:139274, sip:5000,   bucket:'stability'},
    {id:'a12',category:'MutualFunds',name:'Kotak Arbitrage',       currentValue:41,     invested:41,     sip:10000,  bucket:'income'},
  ],
  liabilities:[],
  goals:[
    {id:'g1',type:'emergency',name:'Emergency Fund',target:272000,current:0,timePeriod:'1',linkedAssetIds:['a12']},
    {id:'g2',type:'retirement',name:'Retirement',target:50000000,current:0,timePeriod:'25',linkedAssetIds:['a1','a2','a3']},
  ],
  customGoals:[
    {id:'cg1',name:'Village Home',target:3000000,current:0,timePeriod:'5',linkedAssetIds:[],notes:'Mangalore tile roof, teak columns, wide verandah'},
  ],
  kids:[],
  insurance:[],
  checkItems:[
    {id:'ci1',label:'Build L1 emergency fund',desc:'4 months expenses in IDFC First Bank savings',done:false},
    {id:'ci2',label:'Fill L2 — Kotak Arbitrage',desc:'8 months expenses target: ₹5.44L',done:false},
    {id:'ci3',label:'Add health insurance',desc:'Family floater — minimum ₹10L cover',done:false},
    {id:'ci4',label:'Add term insurance',desc:'Income protection — minimum 15× annual income',done:false},
  ],
  l1Balance:0,
};

const GOAL_PRESETS=[
  {id:'emergency',name:'Emergency Fund',   icon:'🛡',  color:'#0e9f6e'},
  {id:'retirement',name:'Retirement',      icon:'🏖',  color:'#1a56db'},
  {id:'home',      name:'Own a Home',      icon:'🏠',  color:'#d97706'},
  {id:'car',       name:'Buy a Car',       icon:'🚗',  color:'#6366f1'},
  {id:'vacation',  name:'Vacation',        icon:'✈️',  color:'#0891b2'},
  {id:'education', name:'Education',       icon:'🎓',  color:'#7c3aed'},
  {id:'wedding',   name:'Wedding',         icon:'💍',  color:'#db2777'},
  {id:'business',  name:'Business',        icon:'💼',  color:'#b45309'},
];
const KID_PHASES=[
  {id:'primary',    label:'Primary School',  ageStart:5,  icon:'📚'},
  {id:'intermediate',label:'Intermediate',  ageStart:10, icon:'📖'},
  {id:'graduation',  label:'Graduation',    ageStart:17, icon:'🎓'},
  {id:'higher',      label:'Higher Ed / PG',ageStart:21, icon:'🏛'},
  {id:'marriage',    label:'Marriage',      ageStart:25, icon:'💍'},
];
const CAT_META={
  MutualFunds:{icon:'📊',bg:'#eff4ff',  label:'Mutual Fund'},
  ETF:        {icon:'🌐',bg:'#fffbeb',  label:'ETF'},
  EPF:        {icon:'🏛',bg:'#f0fdf4',  label:'EPF'},
  PPF:        {icon:'📮',bg:'#f0fdf4',  label:'PPF'},
  NPS:        {icon:'🔐',bg:'#f3f4f6',  label:'NPS'},
  Gold:       {icon:'🥇',bg:'#fffbeb',  label:'Gold'},
  FD:         {icon:'🏦',bg:'#eff4ff',  label:'FD'},
  RealEstate: {icon:'🏠',bg:'#fffbeb',  label:'Real Estate'},
  Savings:    {icon:'💰',bg:'#f0fdf4',  label:'Savings'},
  Other:      {icon:'📁',bg:'#f3f4f6',  label:'Other'},
};
const BUCKET_META={
  income:   {label:'Income (L2)',   color:'#1a56db',note:'Liquid/Arbitrage — 8–24 mo expenses'},
  stability:{label:'Stability (L3)',color:'#d97706',note:'BAF/Hybrid/Gold — 3–5 yr buffer'},
  return:   {label:'Return',        color:'#0e9f6e',note:'Equity — long-term growth'},
  retire:   {label:'Retirement',    color:'#7c3aed',note:'EPF/PPF/NPS — locked corpus'},
};

let D={};
let _confirmCb=null;
let mMode=null;
let curPg='home';

function load(){try{const s=localStorage.getItem(STORAGE_KEY);D=s?{...DEF_DATA,...JSON.parse(s)}:JSON.parse(JSON.stringify(DEF_DATA));}catch{D=JSON.parse(JSON.stringify(DEF_DATA));}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(D));bump();}
function bump(){const c=parseInt(localStorage.getItem('wp4_saves')||'0')+1;localStorage.setItem('wp4_saves',c);if(c>0&&c%10===0)showBackupBanner();}

// ── HELPERS ──────────────────────────────────────────
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const year=()=>new Date().getFullYear();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmt(n){n=Number(n||0);if(n>=10000000)return'₹'+(n/10000000).toFixed(2)+'Cr';if(n>=100000)return'₹'+(n/100000).toFixed(2)+'L';if(n>=1000)return'₹'+(n/1000).toFixed(1)+'K';return'₹'+Math.round(n).toLocaleString('en-IN');}
function pct(v,t){if(!t)return 0;return Math.min(100,Math.round((Number(v)/Number(t))*100));}
function projCalc(lump,sip,yrs){const r=0.12/12,n=yrs*12;return lump*Math.pow(1+r,n)+sip*((Math.pow(1+r,n)-1)/r)*(1+r);}
function linkedAssetTotal(ids){return(ids||[]).reduce((s,id)=>{const a=D.assets.find(x=>x.id===id);return s+Number(a?.currentValue||0)},0);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function lockScroll(){document.body.classList.add('locked');}
function unlockScroll(){document.body.classList.remove('locked');}
function yearsUntil(birthYr,ageStart){return(birthYr+ageStart)-year();}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

function pnlPill(v,i){const d=v-i,p=i>0?((d/i)*100).toFixed(1):0;const cls=d>=0?'pill-green':'pill-red';return`<span class="pill ${cls}">${d>=0?'+':''}${p}%</span>`;}

// ── NAV ──────────────────────────────────────────────
function nav(el,pg){
  document.querySelectorAll('.nvi').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('act'));
  document.getElementById('pg-'+pg).classList.add('act');
  curPg=pg;renderPg(pg);
}
function renderPg(pg){
  if(pg==='home')    renderHome();
  if(pg==='goals')   renderGoals();
  if(pg==='invest')  renderInvest();
  if(pg==='sip')     renderSip();
  if(pg==='settings')renderSettings();
}

// ══════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════
function renderHome(){
  const totalAssets=D.assets.reduce((s,a)=>s+Number(a.currentValue||0),0);
  const totalLiab=D.liabilities.reduce((s,l)=>s+Number(l.outstanding||0),0);
  const totalInv=D.assets.reduce((s,a)=>s+Number(a.invested||0),0);
  const netWorth=totalAssets-totalLiab;
  const gain=totalAssets-totalInv;
  const income=Number(D.profile.monthlyIncome||0);
  const expenses=Number(D.profile.monthlyExpenses||0);
  const surplus=income-expenses;
  const sipTotal=D.assets.reduce((s,a)=>s+Number(a.sip||0),0);
  const emiTotal=D.liabilities.reduce((s,l)=>s+Number(l.emi||0),0);

  // Allocation by bucket
  const buckets={income:0,stability:0,return:0,retire:0};
  D.assets.forEach(a=>{const b=a.bucket||'return';buckets[b]=(buckets[b]||0)+Number(a.currentValue||0);});
  const colors={income:'#1a56db',stability:'#d97706',return:'#0e9f6e',retire:'#7c3aed'};
  const allocBar=Object.entries(buckets).map(([k,v])=>`<div style="flex:${v||0};background:${colors[k]};min-width:3px"></div>`).join('');
  const allocLegend=Object.entries(buckets).map(([k,v])=>`<div class="alloc-item"><div class="alloc-dot" style="background:${colors[k]}"></div>${BUCKET_META[k].label} ${totalAssets>0?(v/totalAssets*100).toFixed(0):'0'}%</div>`).join('');

  // Safety banner
  let safetyHtml=renderSafetyBanner();

  // Goal health
  let allGoals=[...GOAL_PRESETS.map(p=>{const g=D.goals.find(x=>x.type===p.id)||{};return{name:p.name,target:Number(g.target||0),current:g.linkedAssetIds?.length>0?linkedAssetTotal(g.linkedAssetIds):Number(g.current||0)}}),...(D.customGoals||[]).map(cg=>({name:cg.name,target:Number(cg.target||0),current:cg.linkedAssetIds?.length>0?linkedAssetTotal(cg.linkedAssetIds):Number(cg.current||0)}))];
  const goalSet=allGoals.filter(g=>g.target>0);
  const goalSaved=goalSet.reduce((s,g)=>s+g.current,0);
  const goalTarget=goalSet.reduce((s,g)=>s+g.target,0);
  const goalPct=goalTarget>0?pct(goalSaved,goalTarget):0;

  document.getElementById('pg-home').innerHTML=`
    ${safetyHtml}
    <div class="hero">
      <div class="hero-lbl">Net worth</div>
      <div class="hero-amt">${fmt(netWorth)}</div>
      <div class="hero-sub">Assets ${fmt(totalAssets)} ${totalLiab?'· Liabilities '+fmt(totalLiab):''} · <span style="color:${gain>=0?'#86efac':'#fca5a5'}">${gain>=0?'+':''}${fmt(gain)} ${totalInv>0?'('+(totalInv>0?((gain/totalInv)*100).toFixed(1):'0')+'%)':''}</span></div>
      <div class="hero-chips">
        <div class="chip">Return ${fmt(buckets.return)}</div>

function renderSafetyBanner(){
  const expenses=Number(D.profile.monthlyExpenses||0);
  const gaps=[];
  if(expenses>0){
    const ef=D.goals.find(g=>g.type==='emergency');
    const efLinked=ef?.linkedAssetIds||[];
    const efSaved=efLinked.length>0?linkedAssetTotal(efLinked):Number(ef?.current||0);
    const efReq=expenses*6;
    if(efSaved<efReq) gaps.push({icon:'🛡',title:'Emergency Fund',badge:efSaved>0?fmt(efReq-efSaved)+' short':'Not started',clr:'var(--amber)'});
  }
  if(!D.insurance.some(i=>i.type==='health')) gaps.push({icon:'🏥',title:'Health Insurance',badge:'Missing',clr:'var(--red)'});
  if(!D.insurance.some(i=>i.type==='term'))   gaps.push({icon:'🔒',title:'Term Insurance',badge:'Missing',clr:'var(--red)'});
  if(!gaps.length) return'';
  const key='safety_dismissed_'+gaps.map(g=>g.title).join('_');
  if(localStorage.getItem('wp4_safety_dismiss')===key) return'';
  const tone=gaps.length===1?{e:'💡',c:'var(--blue)',bg:'rgba(37,99,235,.06)',b:'rgba(37,99,235,.15)',lbl:'Heads up'}:gaps.length===2?{e:'⚠️',c:'var(--amber)',bg:'var(--amber-bg)',b:'rgba(217,119,6,.2)',lbl:'Safety gaps'}:{e:'🚨',c:'var(--red)',bg:'var(--red-bg)',b:'rgba(224,36,36,.2)',lbl:'Safety at risk'};
  return`<div style="padding:14px 16px 0"><div style="background:${tone.bg};border:1px solid ${tone.b};border-radius:var(--r-lg);overflow:hidden">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid ${tone.b}">
      <span>${tone.e}</span><span style="font-size:12px;font-weight:700;color:${tone.c};flex:1">${tone.lbl}</span>
      <button onclick="dismissSafety('${key}')" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:2px 4px">✕</button>
    </div>
    ${gaps.map(g=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid ${tone.b}">
      <span>${g.icon}</span><span style="font-size:12px;font-weight:600;color:var(--t1);flex:1">${g.title}</span>
      <span style="font-size:10px;font-weight:700;color:${g.clr};background:${g.clr==='var(--red)'?'var(--red-bg)':'var(--amber-bg)'};padding:2px 7px;border-radius:99px">${g.badge}</span>
    </div>`).join('')}
  </div></div>`;
}
function dismissSafety(key){localStorage.setItem('wp4_safety_dismiss',key);renderHome();}

function renderGoals(){
  let html='';
  // Emergency + Retirement + Other preset goals
  const presetHtml=GOAL_PRESETS.map(pr=>{
    const g=D.goals.find(x=>x.type===pr.id)||{};
    const target=Number(g.target||0);
    const linkedIds=g.linkedAssetIds||[];
    const current=linkedIds.length>0?linkedAssetTotal(linkedIds):Number(g.current||0);
    const p=pct(current,target);
    const isOpen=localStorage.getItem('wp4_goal_open_'+pr.id)==='1';
    let pCls='pill-muted',pTxt='Not set';
    if(target>0){pCls=p>=100?'pill-blue':p>=60?'pill-green':'pill-amber';pTxt=p>=100?'Complete':p>=60?'On track':'Building'}
    return`<div class="goal-card${isOpen?' open':''}" id="gc-${pr.id}">
      <div class="goal-card-hdr" onclick="toggleGC('${pr.id}')">
        <div class="goal-card-icon" style="background:${pr.color}22;border:1px solid ${pr.color}33">${pr.icon}</div>
        <div class="goal-card-name">${pr.name}</div>
        <div class="goal-card-meta">
          <span class="pill ${pCls}">${pTxt}</span>
          ${target>0?`<span class="goal-card-pct">${p}%</span>`:''}
          <span class="goal-card-chev">▾</span>
        </div>
      </div>
      <div class="goal-card-body">
        ${target>0?`
        <div class="goal-card-progress">
          <div class="goal-card-bar-row">
            <span class="goal-card-saved">${fmt(current)}${linkedIds.length>0?'<span style="font-size:10px;color:var(--t4);margin-left:4px">auto</span>':''}</span>
            <span class="goal-card-target">of ${fmt(target)} ${g.timePeriod?'· '+g.timePeriod+'y':''}</span>
          </div>
          <div class="prog-track"><div class="prog-fill" style="background:${pr.color};width:${p}%"></div></div>
          ${g.timePeriod&&g.expectedReturn?`<div style="font-size:11px;color:var(--t4);margin-top:5px">Est. SIP needed: ${fmt(Math.max(0,(target-current)/(Number(g.timePeriod)*12)))}/mo</div>`:''}
        </div>`:`<div style="padding:10px 14px 4px;font-size:12px;color:var(--t3)">No target set yet.</div>`}
        <div class="goal-card-actions">
          <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="openSheet('goal','${pr.id}')">✏️ Edit goal</button>
        </div>
      </div>
    </div>`;
  }).join('');
  html+=`<div class="csec"><div class="csec-hd open" onclick="toggleCSec('preset-goals',this)"><span class="csec-hd-l">Savings goals</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div><div class="csec-body open" id="csec-preset-goals"><div class="csec-body-inner">${presetHtml}<button class="add-btn" onclick="openSheet('customGoal',null)">+ Add custom goal</button></div></div></div>`;

  // Custom goals
  const cgHtml=(D.customGoals||[]).map(cg=>{
    const target=Number(cg.target||0);
    const linkedIds=cg.linkedAssetIds||[];
    const current=linkedIds.length>0?linkedAssetTotal(linkedIds):Number(cg.current||0);
    const p=pct(current,target);
    const isOpen=localStorage.getItem('wp4_cg_open_'+cg.id)==='1';
    return`<div class="goal-card${isOpen?' open':''}" id="cgc-${cg.id}" style="border-left:3px solid #a78bfa">
      <div class="goal-card-hdr" onclick="toggleCGC('${cg.id}')">
        <div class="goal-card-icon" style="background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.2)">⭐</div>
        <div class="goal-card-name">${esc(cg.name)}</div>
        <div class="goal-card-meta">
          ${target>0?`<span class="goal-card-pct">${p}%</span>`:''}
          <span class="goal-card-chev">▾</span>
        </div>
      </div>
      <div class="goal-card-body">
        ${target>0?`<div class="goal-card-progress">
          <div class="goal-card-bar-row"><span class="goal-card-saved">${fmt(current)}</span><span class="goal-card-target">of ${fmt(target)}${cg.timePeriod?' · '+cg.timePeriod+'y':''}</span></div>
          <div class="prog-track"><div class="prog-fill" style="background:#a78bfa;width:${p}%"></div></div>
          ${cg.notes?`<div style="font-size:11px;color:var(--t4);margin-top:5px">${esc(cg.notes)}</div>`:''}
        </div>`:`<div style="padding:10px 14px 4px;font-size:12px;color:var(--t3)">No target set.</div>`}
        <div class="goal-card-actions">
          <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="openSheet('customGoal','${cg.id}')">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delCustomGoal('${cg.id}')">🗑 Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
  if(D.customGoals?.length) html+=`<div class="csec"><div class="csec-hd open" onclick="toggleCSec('cgoals',this)"><span class="csec-hd-l">Custom goals</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div><div class="csec-body open" id="csec-cgoals"><div class="csec-body-inner">${cgHtml}</div></div></div>`;

  // Kids
  html+=renderKidsSection();

  // Insurance
  html+=renderInsuranceSection();

  // Checklist
  html+=renderChecklistSection();

  document.getElementById('pg-goals').innerHTML=html+`<div class="last-upd">Tap any goal to update</div><div class="pg-spacer"></div>`;
}

function toggleGC(id){const c=document.getElementById('gc-'+id);if(!c)return;const o=c.classList.toggle('open');localStorage.setItem('wp4_goal_open_'+id,o?'1':'0');}
function toggleCGC(id){const c=document.getElementById('cgc-'+id);if(!c)return;const o=c.classList.toggle('open');localStorage.setItem('wp4_cg_open_'+id,o?'1':'0');}

function renderKidsSection(){
  if(!D.kids.length) return`<div class="csec"><div class="csec-hd" onclick="toggleCSec('kids',this)"><span class="csec-hd-l">Kids education</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div><div class="csec-body" id="csec-kids"><div class="csec-body-inner"><div class="empty"><div class="empty-icon">👶</div><div class="empty-text">No children added</div></div><button class="add-btn" onclick="openSheet('child',null)">+ Add child</button></div></div></div>`;
  const kidsHtml=D.kids.map(k=>{
    const phases=k.phases.filter(p=>p.enabled);
    const ks=phases.reduce((s,p)=>{const l=p.linkedAssetIds||[];return s+(l.length?linkedAssetTotal(l):Number(p.current||0));},0);
    const kt=phases.reduce((s,p)=>s+Number(p.target||0),0);
    const kp=pct(ks,kt);
    const phaseRows=KID_PHASES.map(pd=>{
      const ph=k.phases.find(p=>p.phaseId===pd.id&&p.enabled);if(!ph)return'';
      const l=ph.linkedAssetIds||[];const cur=l.length?linkedAssetTotal(l):Number(ph.current||0);
      const p=pct(cur,ph.target||0);const yl=yearsUntil(k.birthYear,pd.ageStart);
      return`<div class="phase-row" onclick="openSheet('phase','${k.id}','${ph.phaseId}')">
        <div class="phase-ico">${pd.icon}</div>
        <div class="phase-info"><div class="phase-name">${pd.label}</div><div class="phase-age">${k.birthYear+pd.ageStart} · ${yl>0?yl+'y left':yl===0?'Active':'Passed'}</div>${ph.target>0?`<div style="font-size:11px;color:var(--t4);margin-top:2px">${fmt(cur)} of ${fmt(ph.target)}</div>`:''}</div>
        <div class="phase-prog"><div class="phase-pct">${p}%</div><div class="prog-track"><div class="prog-fill" style="background:var(--blue);width:${p}%"></div></div></div>
      </div>`;
    }).join('');
    return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border)">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${k.gender==='girl'?'👧':'👦'}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--t1)">${esc(k.name)}</div><div style="font-size:11px;color:var(--t3)">Born ${k.birthYear} · Age ${year()-k.birthYear}</div></div>
        <div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--blue);font-family:var(--mono)">${kp}%</div><div style="font-size:10px;color:var(--t4)">${fmt(ks)} of ${fmt(kt)}</div></div>
      </div>
      ${phaseRows}
      <div style="padding:10px 14px;border-top:1px solid var(--border)">
        <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center" onclick="openSheet('child','${k.id}')">✏️ Edit child</button>
      </div>
    </div>`;
  }).join('');
  return`<div class="csec"><div class="csec-hd open" onclick="toggleCSec('kids',this)"><span class="csec-hd-l">Kids education</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div><div class="csec-body open" id="csec-kids"><div class="csec-body-inner">${kidsHtml}<button class="add-btn" onclick="openSheet('child',null)">+ Add child</button></div></div></div>`;
}

function renderInsuranceSection(){
  const insHtml=D.insurance.map(ins=>{
    const type=ins.type==='health'?'🏥 Health Insurance':'🔒 Term Insurance';
    const today=new Date();today.setHours(0,0,0,0);
    let expiryHtml='';
    if(ins.expiry){const p=ins.expiry.split('-');if(p.length===3){const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));const diff=Math.ceil((d-today)/(1000*60*60*24));expiryHtml=diff<=0?`<span class="pill pill-red">Expired</span>`:diff<=30?`<span class="pill pill-red">Exp in ${diff}d</span>`:diff<=90?`<span class="pill pill-amber">Exp in ${diff}d</span>`:'';}}
    return`<div class="ins-row" onclick="openSheet('insurance','${ins.id}')">
      <div style="width:36px;height:36px;border-radius:10px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${ins.type==='health'?'🏥':'🔒'}</div>
      <div style="flex:1;min-width:0"><div class="acard-name">${esc(ins.policyName||type)}</div><div class="acard-meta">${type} · Cover ${fmt(ins.coverAmount)}</div></div>
      <div style="text-align:right">${expiryHtml}<div style="font-size:12px;font-weight:600;color:var(--t1);font-family:var(--mono);margin-top:3px">${fmt(ins.premium)}/yr</div></div>
    </div>`;
  }).join('');
  return`<div class="csec"><div class="csec-hd open" onclick="toggleCSec('insurance',this)"><span class="csec-hd-l">Insurance</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div><div class="csec-body open" id="csec-insurance"><div class="csec-body-inner">${insHtml||'<div class="empty"><div class="empty-icon">🛡</div><div class="empty-text">No policies added</div></div>'}<button class="add-btn" onclick="openSheet('insurance',null)">+ Add policy</button></div></div></div>`;
}

function renderChecklistSection(){
  const items=D.checkItems||[];
  const done=items.filter(i=>i.done).length;
  const itemsHtml=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">`+items.map(item=>`<div class="check-item${item.done?' done':''}" onclick="toggleCheck('${item.id}')">
    <div class="check-box">${item.done?'✓':''}</div>
    <div style="flex:1"><div class="check-label">${esc(item.label)}${item.done?'<span style="font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-l);padding:1px 7px;border-radius:99px;margin-left:6px">Done</span>':''}</div>${item.desc?`<div class="check-desc">${esc(item.desc)}</div>`:''}</div>
    <button onclick="event.stopPropagation();delCheck('${item.id}')" style="background:none;border:none;color:var(--t4);cursor:pointer;font-size:14px;padding:4px">✕</button>
  </div>`).join('')+'</div>'+`<button class="add-btn" onclick="openSheet('checkItem',null)">+ Add item</button>`;
  return`<div class="csec"><div class="csec-hd open" onclick="toggleCSec('checklist',this)"><span class="csec-hd-l">Financial checklist</span><div class="csec-hd-r"><span class="csec-tot">${done}/${items.length}</span><span class="csec-chev">▾</span></div></div><div class="csec-body open" id="csec-checklist"><div class="csec-body-inner">${itemsHtml}</div></div></div>`;
}

function toggleCheck(id){const i=D.checkItems.find(x=>x.id===id);if(i){i.done=!i.done;save();renderGoals();}}
function delCheck(id){showConfirm('Remove item?','This item will be deleted.',()=>{D.checkItems=D.checkItems.filter(x=>x.id!==id);save();renderGoals();toast('Removed');});}
function delCustomGoal(id){showConfirm('Delete goal?','This custom goal will be removed.',()=>{D.customGoals=D.customGoals.filter(x=>x.id!==id);save();renderGoals();toast('Deleted');});}

function csec(id,title,tot,inner,open=true){
  return`<div class="csec"><div class="csec-hd${open?' open':''}" onclick="toggleCSec('${id}',this)"><span class="csec-hd-l">${title}</span><div class="csec-hd-r">${tot?`<span class="csec-tot">${tot}</span>`:''}<span class="csec-chev">▾</span></div></div><div class="csec-body${open?' open':''}" id="csec-${id}"><div class="csec-body-inner">${inner}</div></div></div>`;
}
function toggleCSec(id,hd){hd.classList.toggle('open');document.getElementById('csec-'+id)?.classList.toggle('open');}

function renderInvest(){
  const totalAssets=D.assets.reduce((s,a)=>s+Number(a.currentValue||0),0);
  const totalInv=D.assets.reduce((s,a)=>s+Number(a.invested||0),0);
  const totalLiab=D.liabilities.reduce((s,l)=>s+Number(l.outstanding||0),0);
  const nw=totalAssets-totalLiab;

  // Group assets by category
  const catGroups={};
  D.assets.forEach(a=>{if(!catGroups[a.category])catGroups[a.category]=[];catGroups[a.category].push(a);});

  let html=`<div class="sec">
    <div class="wealth-card">
      <div class="stat-lbl">Net worth (assets − liabilities)</div>
      <div class="wealth-val">${fmt(nw)}</div>
      <div class="wealth-grid">
        <div class="wealth-cell"><div class="wealth-cell-lbl">Total assets</div><div class="wealth-cell-val">${fmt(totalAssets)}</div></div>
        <div class="wealth-cell"><div class="wealth-cell-lbl">Liabilities</div><div class="wealth-cell-val" style="color:${totalLiab>0?'var(--red)':'var(--green)'}">${totalLiab?fmt(totalLiab):'Debt free 🎉'}</div></div>
      </div>
    </div>
    <div class="stat-grid" style="margin-bottom:0">
      <div class="stat-card"><div class="stat-lbl">Invested</div><div class="stat-val">${fmt(totalInv)}</div></div>
      <div class="stat-card"><div class="stat-lbl">Overall P&L</div><div class="stat-val ${totalAssets>=totalInv?'pos':'neg'}">${totalInv>0?((totalAssets-totalInv)/totalInv*100).toFixed(1)+'%':'—'}</div></div>
    </div>
  </div>`;

  // Asset sections by category
  Object.entries(catGroups).forEach(([cat,items])=>{
    const meta=CAT_META[cat]||CAT_META.Other;
    const tot=items.reduce((s,a)=>s+Number(a.currentValue||0),0);
    const inner=items.map(a=>{
      const p=a.invested>0?((a.currentValue-a.invested)/a.invested*100).toFixed(1):null;
      return`<div class="acard" onclick="openSheet('asset','${a.id}')">
        <div class="acard-icon" style="background:${meta.bg}">${meta.icon}</div>
        <div class="acard-body"><div class="acard-name">${esc(a.name)}<span class="badge bd-blue">${BUCKET_META[a.bucket||'return'].label.split(' ')[0]}</span></div><div class="acard-meta">${a.sip>0?'SIP '+fmt(a.sip)+'/mo · ':''}</div></div>
        <div class="acard-right"><div class="acard-val">${fmt(a.currentValue)}</div>${p!==null?`<div class="acard-pnl ${Number(p)>=0?'pos':'neg'}">${Number(p)>=0?'+':''}${p}%</div>`:''}</div>
      </div>`;
    }).join('')+`<button class="add-btn" onclick="openSheet('asset',null,'${cat}')">+ Add ${meta.label}</button>`;
    html+=csec('cat-'+cat, meta.label+' ('+items.length+')', fmt(tot), inner, true);
  });
  html+=csec('cat-new','Add new category','',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${Object.keys(CAT_META).filter(k=>!catGroups[k]).map(k=>`<button class="add-btn" style="margin:0" onclick="openSheet('asset',null,'${k}')">+ ${CAT_META[k].label}</button>`).join('')}</div>`,false);

  // Liabilities
  const liabHtml=D.liabilities.length?D.liabilities.map(l=>`<div class="acard" onclick="openSheet('liability','${l.id}')">
    <div class="acard-icon" style="background:var(--red-l)">💳</div>
    <div class="acard-body"><div class="acard-name">${esc(l.name)}</div><div class="acard-meta">EMI ${fmt(l.emi)}/mo · ${l.interestRate}% p.a.</div></div>
    <div class="acard-right"><div class="acard-val" style="color:var(--red)">${fmt(l.outstanding)}</div></div>
  </div>`).join(''):`<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">No liabilities — debt free!</div></div>`;
  html+=csec('liab','Liabilities',D.liabilities.length?fmt(D.liabilities.reduce((s,l)=>s+Number(l.outstanding||0),0)):'',liabHtml+`<button class="add-btn" onclick="openSheet('liability',null)">+ Add liability</button>`,true);

  document.getElementById('pg-invest').innerHTML=html+`<div class="last-upd">Tap any card to update</div><div class="pg-spacer"></div>`;
}

// SIP

function renderSip(){
  const sipItems=D.assets.filter(a=>Number(a.sip||0)>0);
  const sipTotal=sipItems.reduce((s,a)=>s+Number(a.sip||0),0);
  const surplus=Number(D.profile.monthlyIncome||0)-Number(D.profile.monthlyExpenses||0);
  const eq=D.assets.filter(a=>a.bucket==='return'||a.bucket==='stability').reduce((s,a)=>s+Number(a.currentValue||0),0);
  const colors=['#3b82f6','#6366f1','#ef4444','#0e9f6e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4'];

  const barsHtml=sipItems.map((a,i)=>{
    const meta=CAT_META[a.category]||CAT_META.Other;
    return`<div class="sip-item" onclick="openSheet('asset','${a.id}')">
      <div class="sip-row">
        <div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:${meta.bg};display:flex;align-items:center;justify-content:center;font-size:14px">${meta.icon}</div><div class="sip-name">${esc(a.name)}</div></div>
        <div class="sip-amt">${fmt(a.sip)}</div>
      </div>
      <div class="sip-bar-track"><div class="sip-bar-fill" style="width:${sipTotal>0?(a.sip/sipTotal*100).toFixed(1):0}%;background:${colors[i%colors.length]}"></div></div>
    </div>`;
  }).join('');

  // Bucket allocation of SIPs
  const bucketSips={income:0,stability:0,return:0,retire:0};
  sipItems.forEach(a=>{bucketSips[a.bucket||'return']=(bucketSips[a.bucket||'return']||0)+Number(a.sip||0);});

  const proj=[3,5,7,10].map(yr=>{const v=projCalc(eq,sipTotal,yr);return`<div class="proj-cell"><div class="proj-yr">${yr} yr</div><div class="proj-amt">${fmt(v)}</div></div>`;}).join('');

  document.getElementById('pg-sip').innerHTML=`
    <div class="hero">
      <div class="hero-lbl">Monthly SIP total</div>
      <div class="hero-amt">${fmt(sipTotal)}</div>
      <div class="hero-sub">${surplus>0?(sipTotal/surplus*100).toFixed(0)+'% of surplus · ':''} ${sipItems.length} fund${sipItems.length!==1?'s':''} · Free cash ${fmt(Math.max(0,surplus-sipTotal))}</div>
    </div>
    ${csec('sip-funds','SIP breakdown — tap to edit', fmt(sipTotal), barsHtml+`<div style="font-size:11px;color:var(--t4);padding:0 2px;margin-top:-4px">Edit SIP amounts by tapping any fund in Assets tab</div>`, true)}
    <div class="csec">
      <div class="csec-hd open" onclick="toggleCSec('sip-proj',this)"><span class="csec-hd-l">Corpus projection (12% CAGR)</span><div class="csec-hd-r"><span class="csec-chev">▾</span></div></div>
      <div class="csec-body open" id="csec-sip-proj"><div class="csec-body-inner">
        <div class="proj-row">${proj}</div>
        <div style="font-size:11px;color:var(--t4);margin-top:8px">Return+Stability base ${fmt(eq)} · SIP ${fmt(sipTotal)}/mo · monthly compounding</div>
      </div></div>
    </div>
    ${csec('sip-cash','Cashflow summary','',`<div class="card" style="margin-bottom:0">
      <div class="info-row"><span class="info-key">Monthly income</span><span class="info-val">${fmt(D.profile.monthlyIncome)}</span></div>
      <div class="info-row"><span class="info-key">Monthly expenses</span><span class="info-val">${fmt(D.profile.monthlyExpenses)}</span></div>
      <div class="info-row"><span class="info-key">Surplus</span><span class="info-val" style="color:var(--blue)">${fmt(surplus)}</span></div>
      <div class="info-row"><span class="info-key">Total SIPs</span><span class="info-val">${fmt(sipTotal)}</span></div>
      <div class="info-row"><span class="info-key">Free cash</span><span class="info-val pos">${fmt(Math.max(0,surplus-sipTotal))}</span></div>
    </div>`,false)}
    <div class="last-upd">SIP amounts updated in Assets tab</div><div class="pg-spacer"></div>`;
}

function openSheet(type,id,extra){
  let html='';
  if(type==='global')   html=sheetGlobal();
  else if(type==='asset')    html=sheetAsset(id,extra);
  else if(type==='liability')html=sheetLiability(id);
  else if(type==='goal')     html=sheetGoal(id);
  else if(type==='customGoal')html=sheetCustomGoal(id);
  else if(type==='child')    html=sheetChild(id);
  else if(type==='phase')    html=sheetPhase(id,extra);
  else if(type==='insurance')html=sheetInsurance(id);
  else if(type==='checkItem')html=sheetCheckItem();
  else if(type==='profile')  html=sheetProfile();
  document.getElementById('sheet-content').innerHTML=html;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  lockScroll();
}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('open');document.getElementById('sheet').classList.remove('open');unlockScroll();}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><div class="field-lbl">Birth year</div><input class="field-inp" id="f-kbirth" type="number" value="${k?.birthYear||year()-5}" inputmode="numeric"></div>
      <div class="field"><div class="field-lbl">Gender</div><select class="field-inp" id="f-kgender"><option value="boy"${k?.gender==='boy'?' selected':''}>Boy</option><option value="girl"${k?.gender==='girl'?' selected':''}>Girl</option></select></div>
    </div>
    <div class="field"><div class="field-lbl">Education phases to track</div>${phaseCheckboxes}</div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-save" onclick="saveChild('${k?.id||''}')">Save</button>
    </div>
    ${k?`<button class="btn-del-full" onclick="delChild('${k.id}')">Delete child</button>`:''}`;
}
function saveChild(id){
  const name=document.getElementById('f-kname').value.trim();if(!name){toast('Name required');return;}
  const phases=KID_PHASES.map(pd=>{const existing=id?D.kids.find(x=>x.id===id)?.phases.find(p=>p.phaseId===pd.id):null;return{phaseId:pd.id,enabled:document.getElementById('ph-'+pd.id)?.checked||false,target:existing?.target||0,current:existing?.current||0,linkedAssetIds:existing?.linkedAssetIds||[]};});
  const obj={id:id||uid(),name,birthYear:+document.getElementById('f-kbirth').value||year()-5,gender:document.getElementById('f-kgender').value,phases};
  if(id){const i=D.kids.findIndex(x=>x.id===id);if(i>=0)D.kids[i]=obj;}else{D.kids.push(obj);}
  D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast(id?'Updated':'Child added');
}
function delChild(id){showConfirm('Remove child?','Education data will be deleted.',()=>{D.kids=D.kids.filter(x=>x.id!==id);D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast('Removed');});}

function sheetPhase(kidId,phaseId){
  const k=D.kids.find(x=>x.id===kidId);if(!k)return'';
  const ph=k.phases.find(p=>p.phaseId===phaseId);if(!ph)return'';
  const pd=KID_PHASES.find(p=>p.id===phaseId);
  const assetOpts=D.assets.map(a=>`<option value="${a.id}"${(ph.linkedAssetIds||[]).includes(a.id)?' selected':''}>${esc(a.name)}</option>`).join('');
  return`<div class="sheet-title">${pd?.icon} ${pd?.label}</div><div class="sheet-sub">${k.name} · age ${k.birthYear+(pd?.ageStart||0)} · ${yearsUntil(k.birthYear,pd?.ageStart||0)>0?yearsUntil(k.birthYear,pd?.ageStart||0)+'y away':'Active'}</div>
    <div class="field"><div class="field-lbl">Target amount (₹)</div><input class="field-inp" id="f-phtarget" type="number" value="${ph.target||0}" inputmode="numeric"></div>
    <div class="field"><div class="field-lbl">Current saved (₹, manual)</div><input class="field-inp" id="f-phcurrent" type="number" value="${ph.current||0}" inputmode="numeric"></div>
    <div class="field"><div class="field-lbl">Linked assets</div><select class="field-inp" id="f-phlinked" multiple style="height:90px">${assetOpts}</select></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-save" onclick="savePhase('${kidId}','${phaseId}')">Save</button>
    </div>`;
}
function savePhase(kidId,phaseId){const k=D.kids.find(x=>x.id===kidId);if(!k)return;const ph=k.phases.find(p=>p.phaseId===phaseId);if(!ph)return;const sel=document.getElementById('f-phlinked');ph.linkedAssetIds=[...sel.selectedOptions].map(o=>o.value);ph.target=+document.getElementById('f-phtarget').value||0;ph.current=+document.getElementById('f-phcurrent').value||0;D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast('Saved');}

function sheetInsurance(id){
  const ins=id?D.insurance.find(x=>x.id===id):null;
  return`<div class="sheet-title">${ins?'Edit policy':'Add insurance'}</div>
    <div class="field"><div class="field-lbl">Type</div><select class="field-inp" id="f-instype"><option value="health"${ins?.type==='health'?' selected':''}>Health Insurance</option><option value="term"${ins?.type==='term'?' selected':''}>Term Insurance</option><option value="vehicle"${ins?.type==='vehicle'?' selected':''}>Vehicle</option><option value="other"${ins?.type==='other'?' selected':''}>Other</option></select></div>
    <div class="field"><div class="field-lbl">Policy name</div><input class="field-inp" id="f-insname" type="text" value="${esc(ins?.policyName||'')}" placeholder="e.g. Star Health Family Floater"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><div class="field-lbl">Annual premium (₹)</div><input class="field-inp" id="f-insprem" type="number" value="${ins?.premium||0}" inputmode="numeric"></div>
      <div class="field"><div class="field-lbl">Cover amount (₹)</div><input class="field-inp" id="f-inscover" type="number" value="${ins?.coverAmount||0}" inputmode="numeric"></div>
    </div>
    <div class="field"><div class="field-lbl">Expiry (DD-MM-YYYY)</div><input class="field-inp" id="f-insexp" type="text" value="${ins?.expiry||''}" placeholder="31-12-2026"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-save" onclick="saveInsurance('${ins?.id||''}')">Save</button>
    </div>
    ${ins?`<button class="btn-del-full" onclick="delInsurance('${ins.id}')">Delete policy</button>`:''}`;
}
function saveInsurance(id){const name=document.getElementById('f-insname').value.trim();if(!name){toast('Name required');return;}const obj={id:id||uid(),type:document.getElementById('f-instype').value,policyName:name,premium:+document.getElementById('f-insprem').value||0,coverAmount:+document.getElementById('f-inscover').value||0,expiry:document.getElementById('f-insexp').value.trim()};if(id){const i=D.insurance.findIndex(x=>x.id===id);if(i>=0)D.insurance[i]=obj;}else{D.insurance.push(obj);}D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast(id?'Updated':'Policy added');}
function delInsurance(id){showConfirm('Delete policy?','',()=>{D.insurance=D.insurance.filter(x=>x.id!==id);D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast('Deleted');});}

function sheetCheckItem(){
  return`<div class="sheet-title">Add checklist item</div>
    <div class="field"><div class="field-lbl">Label</div><input class="field-inp" id="f-cilabel" type="text" placeholder="e.g. Buy Gold SGB"></div>
    <div class="field"><div class="field-lbl">Description (optional)</div><input class="field-inp" id="f-cidesc" type="text" placeholder="Details..."></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Cancel</button>
      <button class="btn-save" onclick="saveCheckItem()">Add</button>
    </div>`;
}
function saveCheckItem(){const label=document.getElementById('f-cilabel').value.trim();if(!label){toast('Label required');return;}if(!D.checkItems)D.checkItems=[];D.checkItems.push({id:uid(),label,desc:document.getElementById('f-cidesc').value.trim(),done:false});D.lastUpdated=new Date().toISOString();save();closeSheet();renderPg(curPg);toast('Added');}

// ── CONFIRM ───────────────────────────────────────────
function showConfirm(title,sub,cb,lbl='Delete',danger=true){_confirmCb=cb;document.getElementById('confirm-title').textContent=title;document.getElementById('confirm-sub').textContent=sub;const ok=document.getElementById('confirm-ok');ok.textContent=lbl||'Delete';ok.style.color=danger?'var(--red)':'var(--blue)';ok.style.background=danger?'var(--red-bg)':'var(--blue-l)';document.getElementById('confirm-box').classList.add('open');lockScroll();ok.onclick=()=>{const f=_confirmCb;closeConfirm();if(f)f();};}
function closeConfirm(){document.getElementById('confirm-box').classList.remove('open');unlockScroll();_confirmCb=null;}

// ── BACKUP ────────────────────────────────────────────
function exportJSON(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wealthpilot-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);localStorage.setItem('wp4_saves','0');toast('Exported ✓');}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.assets||!p.goals)throw new Error();D={...DEF_DATA,...p};save();renderPg(curPg);toast('Imported ✓');}catch{toast('Invalid JSON');}};r.readAsText(f);e.target.value='';}
function resetData(){showConfirm('Reset all data?','Everything will be wiped.',()=>{D=JSON.parse(JSON.stringify(DEF_DATA));D.lastUpdated=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(D));renderPg(curPg);toast('Reset');});}
function showBackupBanner(){document.getElementById('backup-modal').classList.add('show');lockScroll();}
function dismissBackupModal(){document.getElementById('backup-modal').classList.remove('show');unlockScroll();localStorage.setItem('wp4_saves','0');}

// ── INIT ─────────────────────────────────────────────
function init(){
  load();
  document.getElementById('hdrDate').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'});
  document.getElementById('hdr-greeting').textContent=greeting();
  updateHeader();
  const sz=parseInt(localStorage.getItem('wp4_fontsize'))||16;
  document.documentElement.style.fontSize=sz+'px';
  renderHome();
}
init();
</script>
</body>
</html>
