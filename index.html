<!DOCTYPE html>
<html lang="en" data-theme="light" data-size="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="appleStatus">
<meta name="apple-mobile-web-app-title" content="WealthPilot">
<title>WealthPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --blue:#1a56db;--blue-l:#eff4ff;--blue-m:#3b82f6;
  --green:#0e9f6e;--green-l:#f0fdf4;
  --amber:#d97706;--amber-l:#fffbeb;
  --red:#e02424;--red-l:#fef2f2;
  --purple:#7c3aed;--purple-l:#f5f3ff;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:10px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 8px rgba(0,0,0,.08);
  /* size tokens — overridden per data-size */
  --fs-xs:11px;--fs-sm:12px;--fs-base:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:30px;
}
[data-size="sm"]{ --fs-xs:10px;--fs-sm:11px;--fs-base:13px;--fs-md:15px;--fs-lg:17px;--fs-xl:22px;--fs-2xl:27px; }
[data-size="lg"]{ --fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-md:17px;--fs-lg:19px;--fs-xl:26px;--fs-2xl:33px; }
[data-size="xl"]{ --fs-xs:13px;--fs-sm:14px;--fs-base:16px;--fs-md:18px;--fs-lg:21px;--fs-xl:28px;--fs-2xl:36px; }

/* ── LIGHT THEME ── */
[data-theme="light"]{
  --bg:#f9fafb;--bg2:#ffffff;--bg3:#f3f4f6;
  --border:#e5e7eb;--border2:#d1d5db;
  --txt:#111827;--txt2:#374151;--txt3:#6b7280;--txt4:#9ca3af;
  --hero-bg:#1a56db;
  --card-icon-blue:#eff4ff;--card-icon-green:#f0fdf4;
  --card-icon-amber:#fffbeb;--card-icon-purple:#f5f3ff;
  --card-icon-red:#fef2f2;--card-icon-gray:#f3f4f6;
  --modal-bg:#ffffff;--overlay:rgba(0,0,0,.45);
  --toggle-bg:#e5e7eb;--toggle-knob:#fff;
}
/* ── DARK THEME — neutral charcoal, no blue tint ── */
[data-theme="dark"]{
  --bg:#111111;--bg2:#1c1c1c;--bg3:#262626;
  --border:#2e2e2e;--border2:#3a3a3a;
  --txt:#f0f0f0;--txt2:#c0c0c0;--txt3:#888888;--txt4:#555555;
  --hero-bg:#1a3a6b;
  --card-icon-blue:#1a2d4a;--card-icon-green:#0d2e20;
  --card-icon-amber:#2e1e06;--card-icon-purple:#221040;
  --card-icon-red:#2e0e0e;--card-icon-gray:#262626;
  --modal-bg:#1c1c1c;--overlay:rgba(0,0,0,.7);
  --toggle-bg:#3a3a3a;--toggle-knob:#f0f0f0;
  --blue:#5b9cf6;
  --green:#34d399;
  --red-l:#2e0e0e;
}
[data-theme="dark"] #themeColor{ content:"#0f1117" }

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:var(--fs-base);line-height:1.5;transition:background .2s,color .2s}
/* ── HEADER ── */
.hdr{position:sticky;top:var(--safe-top);z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.hdr-brand{display:flex;align-items:center;gap:8px}
.hdr-logo{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center}
.hdr-logo svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{font-size:var(--fs-md);font-weight:700;color:var(--txt);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-date{font-size:var(--fs-xs);color:var(--txt4);font-family:var(--mono)}
.btn-hdr{background:var(--blue);color:#fff;font-size:var(--fs-sm);font-weight:600;padding:7px 14px;border-radius:20px;border:none;cursor:pointer}
.btn-hdr-ghost{background:var(--bg3);color:var(--txt2);font-size:var(--fs-sm);font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--border2);cursor:pointer}
.btn-hdr:active,.btn-hdr-ghost:active{opacity:.8}

body{padding-top:var(--safe-top);padding-bottom:0}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);box-shadow:0 -1px 6px rgba(0,0,0,.06)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;cursor:pointer;border:none;background:none;transition:opacity .1s}
.bni-icon{font-size:18px;color:var(--txt4);line-height:1}
.bni-label{font-size:var(--fs-xs);font-weight:500;color:var(--txt4)}
.bni.act .bni-icon,.bni.act .bni-label{color:var(--blue)}
.bni.act{position:relative}
.bni.act::after{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--blue);border-radius:0 0 2px 2px}

/* ── PAGES ── */
.pg{display:none}
.pg.act{display:block}
.pg-spacer{height:calc(88px + var(--safe-bottom))}
.section{padding:14px 16px 0}

/* ── COLLAPSIBLE SECTIONS ── */
.csec{padding:14px 16px 0}
.csec-hd{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:0;user-select:none}
.csec-hd-left{font-size:var(--fs-xs);font-weight:600;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase}
.csec-hd-right{display:flex;align-items:center;gap:8px}
.csec-total{font-size:var(--fs-xs);font-weight:600;color:var(--txt2);font-family:var(--mono)}
.csec-chevron{font-size:14px;color:var(--txt4);transition:transform .22s;line-height:1}
.csec-hd.open .csec-chevron{transform:rotate(180deg)}
.csec-body{overflow:hidden;transition:max-height .28s ease,opacity .22s;max-height:0;opacity:0}
.csec-body.open{max-height:2000px;opacity:1}
.csec-body-inner{padding-top:10px}

.sec-hd{font-size:var(--fs-xs);font-weight:600;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}

/* ── HERO ── */
.hero{margin:14px 16px 0;background:var(--hero-bg);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;background:rgba(255,255,255,.07);border-radius:50%}
.hero-lbl{font-size:var(--fs-xs);font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.hero-amt{font-size:var(--fs-2xl);font-weight:700;color:#fff;letter-spacing:-.8px;font-family:var(--mono)}
.hero-sub{font-size:var(--fs-sm);color:rgba(255,255,255,.75);margin-top:4px}
.hero-chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:var(--fs-xs);font-weight:500;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-lbl{font-size:var(--fs-xs);color:var(--txt3);font-weight:500;margin-bottom:5px}
.stat-val{font-size:var(--fs-lg);font-weight:700;color:var(--txt);font-family:var(--mono)}
.stat-sub{font-size:var(--fs-xs);color:var(--txt4);margin-top:3px}

/* ── ALLOC ── */
.alloc-bar{height:8px;border-radius:8px;display:flex;overflow:hidden;gap:2px;margin-bottom:10px}
.alloc-legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.alloc-item{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--txt3)}
.alloc-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── ASSET CARD ── */
.acard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,background .15s}
.acard:active{border-color:var(--blue);background:var(--bg3)}
.acard-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.acard-body{flex:1;min-width:0}
.acard-name{font-size:var(--fs-base);font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-meta{font-size:var(--fs-xs);color:var(--txt4);margin-top:2px}
.acard-right{text-align:right;flex-shrink:0}
.acard-val{font-size:var(--fs-base);font-weight:700;color:var(--txt);font-family:var(--mono)}
.acard-pnl{font-size:var(--fs-xs);margin-top:2px;font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--txt4)}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-left:5px;vertical-align:middle}
.bd-blue{background:var(--card-icon-blue);color:var(--blue)}
.bd-green{background:var(--card-icon-green);color:var(--green)}
.bd-amber{background:var(--card-icon-amber);color:var(--amber)}
.bd-purple{background:var(--card-icon-purple);color:var(--purple)}
.bd-gray{background:var(--card-icon-gray);color:var(--txt3)}
.bd-red{background:var(--card-icon-red);color:var(--red)}

/* ── BUCKETS ── */
.bkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bkt{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.bkt-lbl{font-size:var(--fs-xs);font-weight:600;color:var(--txt4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.bkt-val{font-size:var(--fs-md);font-weight:700;color:var(--txt);font-family:var(--mono)}
.bkt-tgt{font-size:10px;color:var(--txt4);margin-top:2px}
.bkt-bar{height:4px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden}
.bkt-fill{height:100%;border-radius:4px}
.bkt-detail{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.bkt-drow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.bkt-dname{font-size:var(--fs-base);font-weight:600;color:var(--txt)}
.bkt-dnote{font-size:var(--fs-xs);color:var(--txt4);margin-top:2px}
.bkt-pct{font-size:var(--fs-sm);font-weight:700;padding:3px 9px;border-radius:20px;font-family:var(--mono)}
.bkt-prog{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:8px}
.bkt-prog-fill{height:100%;border-radius:6px}
.bkt-nums{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--txt4);font-family:var(--mono)}

/* ── SIP ── */
.sip-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.sip-item:active{border-color:var(--blue)}
.sip-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sip-name{font-size:var(--fs-base);font-weight:600;color:var(--txt)}
.sip-amt{font-size:var(--fs-md);font-weight:700;color:var(--blue);font-family:var(--mono)}
.sip-bar-track{height:5px;background:var(--bg3);border-radius:5px;overflow:hidden}
.sip-bar-fill{height:100%;border-radius:5px}

/* ── PROJ ── */
.proj-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.proj-cell{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.proj-yr{font-size:var(--fs-xs);color:var(--txt4);font-weight:500;margin-bottom:4px}
.proj-amt{font-size:var(--fs-sm);font-weight:700;color:var(--blue);font-family:var(--mono)}

/* ── INFO ROWS ── */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-key{font-size:var(--fs-sm);color:var(--txt3)}
.info-val{font-size:var(--fs-sm);font-weight:600;color:var(--txt);font-family:var(--mono)}

/* ── SETTINGS PAGE ── */
.settings-section{padding:16px 16px 0}
.settings-title{font-size:var(--fs-xs);font-weight:600;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.settings-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow-left{flex:1}
.srow-label{font-size:var(--fs-base);font-weight:500;color:var(--txt)}
.srow-sub{font-size:var(--fs-xs);color:var(--txt4);margin-top:2px}
/* Toggle */
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--toggle-bg);border-radius:13px;transition:background .2s;cursor:pointer}
.toggle input:checked + .toggle-track{background:var(--blue)}
.toggle-track::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:var(--toggle-knob);top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .toggle-track::after{transform:translateX(18px)}
/* Size pills */
.size-pills{display:flex;gap:6px;flex-shrink:0}
.size-pill{padding:5px 12px;border-radius:20px;font-size:var(--fs-xs);font-weight:600;border:1px solid var(--border2);background:var(--bg3);color:var(--txt3);cursor:pointer;transition:all .15s}
.size-pill.act{background:var(--blue);color:#fff;border-color:var(--blue)}
/* Backup buttons */
.backup-btns{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.btn-backup{width:100%;padding:13px;border-radius:var(--radius);font-size:var(--fs-base);font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-export{background:var(--blue);color:#fff}
.btn-import{background:var(--bg3);color:var(--txt2);border:1px solid var(--border2)}
.btn-reset{background:var(--red-l);color:var(--red);border:1px solid rgba(224,36,36,.2)}
.btn-backup:active{opacity:.85}
#file-input{display:none}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--overlay);backdrop-filter:blur(3px)}
.overlay.open{display:flex;align-items:flex-end}
.modal{background:var(--modal-bg);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bottom));border-top:1px solid var(--border)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:var(--fs-lg);font-weight:700;color:var(--txt);margin-bottom:3px}
.modal-sub{font-size:var(--fs-sm);color:var(--txt4);margin-bottom:18px}
.field{margin-bottom:14px}
.field-lbl{font-size:var(--fs-xs);font-weight:600;color:var(--txt3);margin-bottom:5px;letter-spacing:.02em}
.field-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:var(--fs-base);padding:11px 12px;outline:none;transition:border-color .15s}
.field-inp:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-save{flex:1;background:var(--blue);color:#fff;font-size:var(--fs-base);font-weight:600;padding:13px;border-radius:10px;border:none;cursor:pointer}
.btn-cancel{flex:1;background:var(--bg3);color:var(--txt2);font-size:var(--fs-base);font-weight:500;padding:13px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.btn-save:active,.btn-cancel:active{opacity:.85}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(72px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);font-size:var(--fs-sm);font-weight:500;padding:10px 20px;border-radius:20px;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.last-upd{text-align:center;font-size:var(--fs-xs);color:var(--txt3);padding:20px 16px 8px;font-family:var(--mono)}
.add-btn{width:100%;padding:11px;margin-bottom:8px;background:transparent;border:1.5px dashed var(--border2);border-radius:var(--radius);font-size:var(--fs-sm);font-weight:600;color:var(--blue);cursor:pointer;transition:background .15s}
.add-btn:active{background:var(--bg3)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">
      <svg viewBox="0 0 24 24"><polyline points="2 17 9 10 13 14 22 5"/><polyline points="16 5 22 5 22 11"/></svg>
    </div>
    <span class="hdr-title">WealthPilot</span>
  </div>
  <div class="hdr-right">
    <span class="hdr-date" id="hdrDate"></span>
    <button class="btn-hdr" onclick="openGlobalEdit()">Edit</button>
  </div>
</header>

<div id="pg-home"    class="pg act"></div>
<div id="pg-assets"  class="pg"></div>
<div id="pg-buckets" class="pg"></div>
<div id="pg-sip"     class="pg"></div>
<div id="pg-settings" class="pg"></div>

<nav class="bnav">
  <button class="bni act" onclick="nav(this,'home')">
    <span class="bni-icon">⌂</span><span class="bni-label">Home</span>
  </button>
  <button class="bni" onclick="nav(this,'assets')">
    <span class="bni-icon">◈</span><span class="bni-label">Assets</span>
  </button>
  <button class="bni" onclick="nav(this,'buckets')">
    <span class="bni-icon">▣</span><span class="bni-label">Buckets</span>
  </button>
  <button class="bni" onclick="nav(this,'sip')">
    <span class="bni-icon">↻</span><span class="bni-label">SIP</span>
  </button>
  <button class="bni" onclick="nav(this,'settings')">
    <span class="bni-icon">⚙</span><span class="bni-label">Settings</span>
  </button>
</nav>

<!-- Edit Modal -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub"   id="modal-sub"></div>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save"   onclick="saveModal()">Save changes</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input for import -->
<input type="file" id="file-input" accept=".json" onchange="importJSON(event)">

<script>
// ── DEFAULT DATA ────────────────────────────────────────────────────────
const DEF = {
  salary:207165, expenses:68000,
  lastUpdated: new Date().toISOString(),
  l1: 0,
  assets:[
    {id:'ppfc',   name:'Parag Parikh Flexi Cap', meta:'Direct · 1,683 units', val:152801, inv:150982, tag:'Flexi cap',  bd:'bd-blue',   cat:'equity',    icon:'📈', bg:'card-icon-blue'},

const INR = n => {
  if(n>=10000000) return '₹'+(n/10000000).toFixed(2)+'Cr';
  if(n>=100000)   return '₹'+(n/100000).toFixed(2)+'L';
  if(n>=1000)     return '₹'+(n/1000).toFixed(1)+'K';
  return '₹'+Math.round(n).toLocaleString('en-IN');
};
const gainPct = (v,i) => { if(!i) return ''; const p=((v-i)/i*100); return (p>=0?'+':'')+p.toFixed(1)+'%'; };
const gclass = (v,i) => v>i?'pos':v<i?'neg':'neu';
const sum = a => a.reduce((s,x)=>s+x,0);
const bycat = c => D.assets.filter(a=>a.cat===c);

// ── PROJECTION HELPER (monthly compounding) ──────────────────────────────
// Lumpsum grows at 12% p.a. compounded monthly
// SIP grows using future value of annuity with monthly rate
function projCalc(lumpsum, monthlyS, years){
  const r = 0.12 / 12; // monthly rate
  const n = years * 12; // total months
  const lumpsumFV = lumpsum * Math.pow(1 + r, n);
  const sipFV = monthlyS * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
  return lumpsumFV + sipFV;
}

function setSize(s){
  document.documentElement.setAttribute('data-size',s);
  const pr=JSON.parse(localStorage.getItem('wp3_prefs')||'{}');
  pr.size=s; savePrefs(pr);
  document.querySelectorAll('.size-pill').forEach(p=>{
    p.classList.toggle('act', p.textContent.toLowerCase()===({sm:'small',md:'medium',lg:'large',xl:'x-large'}[s]));
  });
  toast('Text size updated');
}

// ── BACKUP ───────────────────────────────────────────────────────────────
function exportJSON(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='wealthpilot-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Backup exported');
}

function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(!parsed.assets||!parsed.sips) throw new Error('Invalid format');
      D=parsed; persist(D);
      render(curPg);
      toast('Data imported successfully');
    }catch{
      toast('Import failed — invalid JSON');
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

function resetData(){
  if(!confirm('Reset all data to defaults? This cannot be undone.')) return;
  D={...DEF, lastUpdated:new Date().toISOString()};
  persist(D); render(curPg);
  toast('Reset to defaults');
}

function saveModal(){
  if(mMode==='global'){
    D.salary   = +document.getElementById('f-sal').value||D.salary;
    D.expenses = +document.getElementById('f-exp').value||D.expenses;
    D.assets.find(a=>a.id==='epf').val = +document.getElementById('f-epf').value;
    D.assets.find(a=>a.id==='ppf').val = +document.getElementById('f-ppf').value;
    D.assets.find(a=>a.id==='nps').val = +document.getElementById('f-nps').value;
    D.l1 = +document.getElementById('f-l1').value;
  } else if(mMode&&mMode.startsWith('asset:')){
    const a=D.assets.find(x=>x.id===mMode.split(':')[1]);
    a.name = document.getElementById('f-name').value||a.name;
    a.val  = +document.getElementById('f-val').value;
    a.inv  = +document.getElementById('f-inv').value;
    a.meta = document.getElementById('f-meta').value;
    a.cat  = document.getElementById('f-cat').value;
    a.icon = document.getElementById('f-icon').value;
    // update badge class based on cat
    const bdMap={equity:'bd-blue',elss:'bd-purple',etf:'bd-amber',liquidity:'bd-green',retire:'bd-green'};
    const bgMap={equity:'card-icon-blue',elss:'card-icon-purple',etf:'card-icon-amber',liquidity:'card-icon-green',retire:'card-icon-green'};
    const tagMap={equity:'Equity',elss:'ELSS',etf:'ETF',liquidity:'Liquidity',retire:'Debt'};
    a.bd=bdMap[a.cat]; a.bg=bgMap[a.cat]; a.tag=tagMap[a.cat];
  } else if(mMode&&mMode.startsWith('add:')){
    const cat=mMode.split(':')[1];
    const name=document.getElementById('f-name').value.trim();
    if(!name){ toast('Fund name required'); return; }
    const bdMap={equity:'bd-blue',elss:'bd-purple',etf:'bd-amber',liquidity:'bd-green',retire:'bd-green'};
    const bgMap={equity:'card-icon-blue',elss:'card-icon-purple',etf:'card-icon-amber',liquidity:'card-icon-green',retire:'card-icon-green'};
    const tagMap={equity:'Equity',elss:'ELSS',etf:'ETF',liquidity:'Liquidity',retire:'Debt'};
    const iconMap={equity:'📈',elss:'🛡',etf:'🌐',liquidity:'⚖️',retire:'🏛'};
    D.assets.push({
      id:'a'+Date.now(), name, cat,
      val:  +document.getElementById('f-val').value||0,
      inv:  +document.getElementById('f-inv').value||0,
      meta: document.getElementById('f-meta').value||'',
      tag:tagMap[cat], bd:bdMap[cat], bg:bgMap[cat], icon:iconMap[cat]
    });
    toast('Fund added');
  } else if(mMode==='l1'){
    D.l1 = +document.getElementById('f-l1b').value;
  } else if(mMode&&mMode.startsWith('sip:')){
    const s=D.sips.find(x=>x.id===mMode.split(':')[1]);
    s.name   = document.getElementById('f-sipname').value||s.name;
    s.amount = +document.getElementById('f-sipamt').value||s.amount;
  } else if(mMode==='add-sip'){
    const name=document.getElementById('f-sipname').value.trim();
    if(!name){ toast('Fund name required'); return; }
    const colors=['#3b82f6','#6366f1','#ef4444','#0e9f6e','#f59e0b','#8b5cf6','#ec4899','#14b8a6'];
    D.sips.push({
      id:'s'+Date.now(), name,
      amount:+document.getElementById('f-sipamt').value||0,
      color: colors[D.sips.length % colors.length]
    });
    toast('SIP added');
  }
  D.lastUpdated=new Date().toISOString();
  persist(D); closeModal(); render(curPg);
  if(!mMode?.startsWith('add')) toast('Saved');
}
